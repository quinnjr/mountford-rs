[package]
name = "mountford-rs"
version = "1.0.0"
edition = "2021"
authors = ["Joseph Quinn <quinn.josephr@protonmail.com>"]
description = "Rust implementation of the Mountford plugin for PluMA - Dissimilarity index computation"
license = "MIT"
repository = "https://github.com/quinnjr/mountford-rs"
keywords = ["bioinformatics", "ecology", "dissimilarity", "diversity", "pluma"]
categories = ["science", "algorithms"]

[lib]
name = "mountford_rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mountford"
path = "src/main.rs"

[dependencies]
csv = "1.3"
rayon = "1.10"
pluma-plugin-trait = "1.1.0"

[dev-dependencies]
tempfile = "3.10"
criterion = "0.8.0"

[[bench]]
name = "mountford_bench"
harness = false
